[project]
name = "kradar-visibility"
version = "0.1.0"
description = "K-Radar multi-sensor visibility analysis pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.4",
    "polars>=1.39.3",
    "pyarrow>=23.0.1",
    "pytest>=9.1.1",
    "scipy>=1.17.1",
    "pyyaml>=6.0.3",
    "opencv-python-headless>=4.11.0.86",
    "pytest-json-report>=1.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "opencv-python>=4.11.0.86",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kradar_visibility"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Exclude `slow` from the default run; invoke long-running tests explicitly
# with `uv run pytest -m slow`. The full smoke suite (excluding `slow`)
# must complete in well under 5 minutes.
addopts = ["-m", "not slow"]
markers = [
    "optional: tests that require extra data or are future scope",
    "slow: tests that take longer than the default smoke budget (e.g. end-to-end pipeline runs); excluded from default runs, invoke with -m slow",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.1.0",
    "pre-commit>=4.5.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.5",
]
