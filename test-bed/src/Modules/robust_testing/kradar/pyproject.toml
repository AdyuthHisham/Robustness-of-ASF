[project]
name = "kradar-visibility"
version = "0.1.0"
description = "K-Radar multi-sensor visibility analysis pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.4",
    "polars>=1.39.3",
    "pyarrow>=23.0.1",
    "pytest>=9.1.1",
    "scipy>=1.17.1",
    "pyyaml>=6.0.3",
    "opencv-python-headless>=4.11.0.86",
    "pytest-json-report>=1.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "opencv-python>=4.11.0.86",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kradar_visibility"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "optional: tests that require extra data or are future scope",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.1.0",
    "pre-commit>=4.5.1",
    "ruff>=0.15.5",
]
