[project]
name = "amscup"
version = "0.1.0"
description = "Robustness of camera/LiDAR/4D-radar fusion (ASF) under sensor corruption and loss, evaluated on K-Radar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6,<2.5",  # 2.5 changes float32 bin-boundary results (SMK-21)
    "polars>=1.42.1",
    "pyarrow>=23.0.1",
    "scipy>=1.18.0",
    "pyyaml>=6.0.3",
    "matplotlib>=3.10.8",
    "opencv-python-headless>=4.11.0.86",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-json-report>=1.5.0",
]
# src/effects needs torch and K-Radar's model code; reference-only, not needed for analysis.
effects = ["torch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kradar_visibility", "src/robustness", "src/effects"]
include = ["src/amscup_paths.py"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# `slow` tests (end-to-end pipeline runs) are excluded by default; run with `uv run pytest -m slow`.
addopts = ["-m", "not slow"]
markers = [
    "optional: tests that require extra data or are future scope",
    "slow: tests that take longer than the default smoke budget; excluded from default runs",
]
