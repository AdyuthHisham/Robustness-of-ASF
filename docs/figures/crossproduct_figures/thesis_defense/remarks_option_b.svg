<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 780" width="2000" height="780"><rect width="2000" height="780" fill="white"/><circle cx="90" cy="90" r="50" fill="#2166AC" stroke="#17497D" stroke-width="4"/><text x="180" y="82" font-family="DejaVu Sans" font-weight="bold" font-size="30" fill="#1A1A1A" text-anchor="start">LiDAR is the most critical sensor</text><text x="180" y="118" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">Localizes objects; both noise and loss hit performance hardest.</text><line x1="60" y1="185" x2="1940" y2="185" stroke="#E4E6E8" stroke-width="2"/><circle cx="90" cy="260" r="38" fill="#B2182B" stroke="#7E111E" stroke-width="4"/><text x="180" y="252" font-family="DejaVu Sans" font-weight="bold" font-size="30" fill="#1A1A1A" text-anchor="start">Radar: intermediate reliance</text><text x="180" y="288" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">Corruption hurts, but less severely than LiDAR, more than camera.</text><line x1="60" y1="355" x2="1940" y2="355" stroke="#E4E6E8" stroke-width="2"/><circle cx="90" cy="430" r="28" fill="#1B7837" stroke="#124F25" stroke-width="4"/><text x="180" y="422" font-family="DejaVu Sans" font-weight="bold" font-size="30" fill="#1A1A1A" text-anchor="start">Camera corruption: little effect</text><text x="180" y="458" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">Trained mainly on normal/overcast; likely already downweighted by fusion.</text><rect x="60" y="545" width="1880" height="120" rx="12" fill="#F4F6F8" stroke="#2A6099" stroke-width="2"/><text x="90" y="590" font-family="DejaVu Sans" font-weight="bold" font-size="24" fill="#194461" text-anchor="start">Partial loss is well tolerated</text><text x="90" y="627" font-family="DejaVu Sans" font-weight="normal" font-size="20" fill="#6B7075" text-anchor="start">Consistent with training under adverse conditions.</text></svg>