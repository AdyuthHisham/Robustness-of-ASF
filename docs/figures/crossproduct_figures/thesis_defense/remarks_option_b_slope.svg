<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 780" width="2200" height="780"><rect width="2200" height="780" fill="white"/><circle cx="90" cy="90" r="50" fill="#2166AC" stroke="#17497D" stroke-width="4"/><text x="180" y="82" font-family="DejaVu Sans" font-weight="bold" font-size="30" fill="#1A1A1A" text-anchor="start">LiDAR is the most critical sensor</text><text x="180" y="118" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">Localizes objects; both noise and loss hit</text><text x="180" y="144" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">performance hardest.</text><line x1="60" y1="185" x2="1150" y2="185" stroke="#E4E6E8" stroke-width="2"/><circle cx="90" cy="260" r="38" fill="#B2182B" stroke="#7E111E" stroke-width="4"/><text x="180" y="252" font-family="DejaVu Sans" font-weight="bold" font-size="30" fill="#1A1A1A" text-anchor="start">Radar: intermediate reliance</text><text x="180" y="288" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">Corruption hurts, but less severely than</text><text x="180" y="314" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">LiDAR, more than camera.</text><line x1="60" y1="355" x2="1150" y2="355" stroke="#E4E6E8" stroke-width="2"/><circle cx="90" cy="430" r="28" fill="#1B7837" stroke="#124F25" stroke-width="4"/><text x="180" y="422" font-family="DejaVu Sans" font-weight="bold" font-size="30" fill="#1A1A1A" text-anchor="start">Camera corruption: little effect</text><text x="180" y="458" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">Trained mainly on normal/overcast; likely</text><text x="180" y="484" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">already downweighted by fusion.</text><rect x="60" y="545" width="1090" height="120" rx="12" fill="#F4F6F8" stroke="#2A6099" stroke-width="2"/><text x="90" y="590" font-family="DejaVu Sans" font-weight="bold" font-size="24" fill="#194461" text-anchor="start">Partial loss is well tolerated</text><text x="90" y="627" font-family="DejaVu Sans" font-weight="normal" font-size="20" fill="#6B7075" text-anchor="start">Consistent with training under adverse conditions.</text><text x="1240" y="30" font-family="DejaVu Sans" font-weight="normal" font-size="16" fill="#B23A3A" text-anchor="start">MOCKUP — illustrative values, not real numbers</text><text x="1350" y="120" font-family="DejaVu Sans" font-weight="bold" font-size="19" fill="#6B7075" text-anchor="middle">Complete Loss</text><text x="2060" y="120" font-family="DejaVu Sans" font-weight="bold" font-size="19" fill="#6B7075" text-anchor="middle">Noise (high)</text><line x1="1350" y1="216.0" x2="2060" y2="489.6" stroke="#2166AC" stroke-width="5"/><circle cx="1350" cy="216.0" r="9" fill="#2166AC"/><circle cx="2060" cy="489.6" r="9" fill="#2166AC"/><text x="1326" y="244.0" font-family="DejaVu Sans" font-weight="bold" font-size="18" fill="#2166AC" text-anchor="end">LiDAR</text><line x1="1350" y1="208.8" x2="2060" y2="374.4" stroke="#B2182B" stroke-width="5"/><circle cx="1350" cy="208.8" r="9" fill="#B2182B"/><circle cx="2060" cy="374.4" r="9" fill="#B2182B"/><text x="1326" y="214.8" font-family="DejaVu Sans" font-weight="bold" font-size="18" fill="#B2182B" text-anchor="end">Radar</text><line x1="1350" y1="183.60000000000002" x2="2060" y2="190.8" stroke="#1B7837" stroke-width="5"/><circle cx="1350" cy="183.60000000000002" r="9" fill="#1B7837"/><circle cx="2060" cy="190.8" r="9" fill="#1B7837"/><text x="1326" y="167.60000000000002" font-family="DejaVu Sans" font-weight="bold" font-size="18" fill="#1B7837" text-anchor="end">Camera</text><text x="1705.0" y="600" font-family="DejaVu Sans" font-weight="bold" font-size="18" fill="#194461" text-anchor="middle">LiDAR drops the most going from loss to noise</text></svg>