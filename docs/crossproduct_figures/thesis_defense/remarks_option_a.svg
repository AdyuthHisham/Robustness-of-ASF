t-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">Noisy-but-present data isn't downweighted the</text><text x="150" y="496" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">way absent data implicitly is.</text><rect x="1020" y="380" width="860" height="150" rx="14" fill="#F4F6F8" stroke="#2A6099" stroke-width="2"/><text x="1050" y="430" font-family="DejaVu Sans" font-weight="bold" font-size="26" fill="#194461" text-anchor="start">Partial loss: well tolerated</text><text x="1050" y="470" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">Consistent with the model being trained under</text><text x="1050" y="496" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">adverse conditions.</text></svg>