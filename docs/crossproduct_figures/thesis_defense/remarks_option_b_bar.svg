<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 780" width="2200" height="780"><rect width="2200" height="780" fill="white"/><circle cx="90" cy="90" r="50" fill="#2166AC" stroke="#17497D" stroke-width="4"/><text x="180" y="82" font-family="DejaVu Sans" font-weight="bold" font-size="30" fill="#1A1A1A" text-anchor="start">LiDAR is the most critical sensor</text><text x="180" y="118" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">Localizes objects; both noise and loss hit</text><text x="180" y="144" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">performance hardest.</text><line x1="60" y1="185" x2="1150" y2="185" stroke="#E4E6E8" stroke-width="2"/><circle cx="90" cy="260" r="38" fill="#B2182B" stroke="#7E111E" stroke-width="4"/><text x="180" y="252" font-family="DejaVu Sans" font-weight="bold" font-size="30" fill="#1A1A1A" text-anchor="start">Radar: intermediate reliance</text><text x="180" y="288" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">Corruption hurts, but less severely than</text><text x="180" y="314" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">LiDAR, more than camera.</text><line x1="60" y1="355" x2="1150" y2="355" stroke="#E4E6E8" stroke-width="2"/><circle cx="90" cy="430" r="28" fill="#1B7837" stroke="#124F25" stroke-width="4"/><text x="180" y="422" font-family="DejaVu Sans" font-weight="bold" font-size="30" fill="#1A1A1A" text-anchor="start">Camera corruption: little effect</text><text x="180" y="458" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">Trained mainly on normal/overcast; likely</text><text x="180" y="484" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="start">already downweighted by fusion.</text><rect x="60" y="545" width="1090" height="120" rx="12" fill="#F4F6F8" stroke="#2A6099" stroke-width="2"/><text x="90" y="590" font-family="DejaVu Sans" font-weight="bold" font-size="24" fill="#194461" text-anchor="start">Partial loss is well tolerated</text><text x="90" y="627" font-family="DejaVu Sans" font-weight="normal" font-size="20" fill="#6B7075" text-anchor="start">Consistent with training under adverse conditions.</text><text x="1240" y="90" font-family="DejaVu Sans" font-weight="bold" font-size="20" fill="#194461" text-anchor="start">LiDAR: noise costs far more retention than complete loss</text><line x1="1240" y1="560" x2="2140" y2="560" stroke="#1A1A1A" stroke-width="3"/><rect x="1336.0" y="323.02" width="48" height="236.98" fill="#2166AC" fill-opacity="0.55"/><text x="1360.0" y="584" font-family="DejaVu Sans" font-weight="normal" font-size="15" fill="#6B7075" text-anchor="middle">Loss</text><rect x="1396.0" y="438.64" width="48" height="121.36" fill="#2166AC" fill-opacity="1.0"/><text x="1420.0" y="584" font-family="DejaVu Sans" font-weight="normal" font-size="15" fill="#6B7075" text-anchor="middle">Noise</text><text x="1390.0" y="616" font-family="DejaVu Sans" font-weight="bold" font-size="20" fill="#1A1A1A" text-anchor="middle">LiDAR</text><rect x="1636.0" y="184.44" width="48" height="375.56" fill="#B2182B" fill-opacity="0.55"/><text x="1660.0" y="584" font-family="DejaVu Sans" font-weight="normal" font-size="15" fill="#6B7075" text-anchor="middle">Loss</text><rect x="1696.0" y="256.19" width="48" height="303.81" fill="#B2182B" fill-opacity="1.0"/><text x="1720.0" y="584" font-family="DejaVu Sans" font-weight="normal" font-size="15" fill="#6B7075" text-anchor="middle">Noise</text><text x="1690.0" y="616" font-family="DejaVu Sans" font-weight="bold" font-size="20" fill="#1A1A1A" text-anchor="middle">Radar</text><rect x="1936.0" y="158.2" width="48" height="401.8" fill="#1B7837" fill-opacity="0.55"/><text x="1960.0" y="584" font-family="DejaVu Sans" font-weight="normal" font-size="15" fill="#6B7075" text-anchor="middle">Loss</text><rect x="1996.0" y="159.84000000000003" width="48" height="400.15999999999997" fill="#1B7837" fill-opacity="1.0"/><text x="2020.0" y="584" font-family="DejaVu Sans" font-weight="normal" font-size="15" fill="#6B7075" text-anchor="middle">Noise</text><text x="1990.0" y="616" font-family="DejaVu Sans" font-weight="bold" font-size="20" fill="#1A1A1A" text-anchor="middle">Camera</text><text x="1690.0" y="652" font-family="DejaVu Sans" font-weight="normal" font-size="19" fill="#6B7075" text-anchor="middle">Retention under corruption</text><text x="1240" y="690" font-family="DejaVu Sans" font-weight="normal" font-size="14" fill="#6B7075" text-anchor="start">N = 58 sequences per condition, all reliable. AP-restricted-range retention, high severity.</text></svg>