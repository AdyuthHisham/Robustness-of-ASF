# Single-corruption run: camera / frame_deletion_new (low)
#
# camera frame deterministically deleted every Nth frame (interval); sets camera keys to None instead of a black-image tensor -- mirrors radar/lidar frame_deletion's None-blackout behaviour. Separate effect from frame_deletion (not a mode flag) so it doesn't overwrite the existing zero-fill frame_deletion sweep results; reported as its own 'camera_frame_deletion_new' condition.
#
# Exactly one effect on exactly one modality -- every other sensor is original
# -- so any change in detections versus the original baseline is attributable
# to this corruption alone. Generated by scripts/alvis/gen_single_effect_configs.py;
# edit that file rather than this one.
seed: 42
radar: []
lidar: []
camera:
  - name: frame_deletion_new
    p: 1.0
    params:
      mode: deterministic
      interval: 19
